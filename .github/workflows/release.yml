name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Create app bundle
        run: |
          APP_NAME="Harmony Split Tunnel Enforcer"
          EXECUTABLE="HarmonySplitTunnelEnforcer"
          BUNDLE_ID="net.rawbytes.harmony-split-tunnel-enforcer"
          BUILD_DIR=".build/apple/Products/Release"

          APP_DIR="${APP_NAME}.app"
          CONTENTS="${APP_DIR}/Contents"
          MACOS="${CONTENTS}/MacOS"
          RESOURCES="${CONTENTS}/Resources"

          mkdir -p "$MACOS" "$RESOURCES"
          cp "${BUILD_DIR}/${EXECUTABLE}" "${MACOS}/${EXECUTABLE}"

          if [ -f AppIcon.icns ]; then
            cp AppIcon.icns "${RESOURCES}/AppIcon.icns"
          fi

          cat > "${CONTENTS}/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>${EXECUTABLE}</string>
              <key>CFBundleIdentifier</key>
              <string>${BUNDLE_ID}</string>
              <key>CFBundleName</key>
              <string>${APP_NAME}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${GITHUB_REF_NAME#v}</string>
              <key>CFBundleVersion</key>
              <string>${GITHUB_RUN_NUMBER}</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
          </dict>
          </plist>
          PLIST

      - name: Ad-hoc codesign
        run: codesign --force --deep --sign - "Harmony Split Tunnel Enforcer.app"

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Harmony Split Tunnel Enforcer" \
            -srcfolder "Harmony Split Tunnel Enforcer.app" \
            -ov -format UDZO \
            "HarmonySplitTunnelEnforcer.dmg"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Harmony Split Tunnel Enforcer $GITHUB_REF_NAME" \
            --generate-notes \
            HarmonySplitTunnelEnforcer.dmg

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 HarmonySplitTunnelEnforcer.dmg | awk '{print $1}')

          gh repo clone 4O4/homebrew-tap /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/split-tunnel-enforcer.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA}\"/" Casks/split-tunnel-enforcer.rb

          git add Casks/split-tunnel-enforcer.rb
          git commit -m "Update split-tunnel-enforcer to ${VERSION}"
          git push
