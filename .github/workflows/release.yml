name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Create app bundle
        run: |
          APP_NAME="Harmony Split Tunnel Enforcer"
          EXECUTABLE="HarmonySplitTunnelEnforcer"
          BUNDLE_ID="net.rawbytes.harmony-split-tunnel-enforcer"
          BUILD_DIR=".build/apple/Products/Release"

          APP_DIR="${APP_NAME}.app"
          CONTENTS="${APP_DIR}/Contents"
          MACOS="${CONTENTS}/MacOS"
          RESOURCES="${CONTENTS}/Resources"

          mkdir -p "$MACOS" "$RESOURCES"
          cp "${BUILD_DIR}/${EXECUTABLE}" "${MACOS}/${EXECUTABLE}"

          if [ -f AppIcon.icns ]; then
            cp AppIcon.icns "${RESOURCES}/AppIcon.icns"
          fi

          cat > "${CONTENTS}/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>${EXECUTABLE}</string>
              <key>CFBundleIdentifier</key>
              <string>${BUNDLE_ID}</string>
              <key>CFBundleName</key>
              <string>${APP_NAME}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${GITHUB_REF_NAME#v}</string>
              <key>CFBundleVersion</key>
              <string>${GITHUB_RUN_NUMBER}</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
          </dict>
          </plist>
          PLIST

      - name: Ad-hoc codesign
        run: codesign --force --deep --sign - "Harmony Split Tunnel Enforcer.app"

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Harmony Split Tunnel Enforcer" \
            -srcfolder "Harmony Split Tunnel Enforcer.app" \
            -ov -format UDZO \
            "HarmonySplitTunnelEnforcer.dmg"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Harmony Split Tunnel Enforcer $GITHUB_REF_NAME" \
            --generate-notes \
            HarmonySplitTunnelEnforcer.dmg

      - name: Update Homebrew tap
        if: env.GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 HarmonySplitTunnelEnforcer.dmg | awk '{print $1}')
          FILE="Casks/harmony-split-tunnel-enforcer.rb"

          # Get current file SHA (needed for update API)
          FILE_SHA=$(gh api "repos/4O4/homebrew-tap/contents/${FILE}" --jq '.sha')

          # Build new content
          CONTENT=$(cat <<CASK
          cask "harmony-split-tunnel-enforcer" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/4O4/harmony-split-tunnel-enforcer/releases/download/v#{version}/HarmonySplitTunnelEnforcer.dmg"
            name "Harmony Split Tunnel Enforcer"
            desc "Enforce split tunneling for Harmony SASE VPN"
            homepage "https://github.com/4O4/harmony-split-tunnel-enforcer"

            depends_on macos: ">= :ventura"

            app "Harmony Split Tunnel Enforcer.app"

            zap trash: [
              "~/Library/Preferences/net.rawbytes.harmony-split-tunnel-enforcer.plist",
            ]
          end
          CASK
          )

          # Update via GitHub API
          echo "$CONTENT" | base64 | gh api "repos/4O4/homebrew-tap/contents/${FILE}" \
            -X PUT \
            -f message="Update harmony-split-tunnel-enforcer to ${VERSION}" \
            -f content=@- \
            -f sha="$FILE_SHA"
